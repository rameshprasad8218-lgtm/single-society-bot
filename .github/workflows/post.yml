name: Single Society poster

on:
  schedule:
    # IST 8:00, 10:30, 13:00, 15:30, 18:00, 20:00, 22:00 (written in UTC)
    - cron: "30 2 * * *"
    - cron: "0 5 * * *"
    - cron: "30 7 * * *"
    - cron: "0 10 * * *"
    - cron: "30 12 * * *"
    - cron: "30 14 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      series:
        description: "subah / mehngai / exam / cricket / bollywood / shahar / neta / trending (blank = auto)"
        required: false
      publish:
        description: "Post to Instagram? (yes/no)"
        default: "yes"

permissions:
  contents: write

concurrency: poster

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: |
          git config user.name "single-society-bot"
          git config user.email "bot@users.noreply.github.com"
      - name: Make and post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.series }}" ]; then ARGS="$ARGS --series ${{ github.event.inputs.series }}"; fi
          if [ "${{ github.event.inputs.publish }}" = "no" ]; then ARGS="$ARGS --no-publish"; fi
          python -m bot.main $ARGS
