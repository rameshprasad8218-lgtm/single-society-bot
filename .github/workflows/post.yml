name: Single Society poster

on:
  schedule:
    # every hour from 8:00 AM to 9:00 PM IST (14 posts/day), written in UTC
    - cron: "30 2-15 * * *"
    # backup run 30 min earlier: GitHub drops/delays scheduled runs (only 6 of 14 ran on 16 Nov); slot dedupe in main.py keeps max 14/day
    - cron: "5 3-15 * * *"
  workflow_dispatch:
    inputs:
      series:
        description: "subah / mehngai / exam / cricket / bollywood / shahar / neta / trending (blank = auto)"
        required: false
      publish:
        description: "Post to Instagram? (yes/no)"
        default: "yes"

permissions:
  contents: write

concurrency: poster

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: |
          git config user.name "single-society-bot"
          git config user.email "bot@users.noreply.github.com"
      - name: Make and post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.series }}" ]; then ARGS="$ARGS --series ${{ github.event.inputs.series }}"; fi
          if [ "${{ github.event.inputs.publish }}" = "no" ]; then ARGS="$ARGS --no-publish"; fi
          python -m bot.main $ARGS
